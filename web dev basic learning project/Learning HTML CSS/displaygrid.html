<!DOCTYPE html>
<html>
    <head>
        <title>Display grid</title>
        <style type="text/css">
            .main{
                width: 700px;
                height: 600px;
                border:2px solid red;
                margin:auto;
                display: grid;
                grid-template-columns: 150px 150px 150px 150px ;
                grid-template-columns: auto auto auto auto;
               /* grid-column-gap: 50px;
                grid-row-gap:30px;*/
                padding:10px;
                grid-gap: 20px 30px;
            }
            .main div{
                padding:50px;
                background-color: aqua;
                border:1px black solid;
                font-size:50px;
            }
            </style>
    </head>
    <body>
        <div class="main">
            <div> 1   </div>
            <div> 2</div>
            <div> 3</div>
             <div>4</div>
            <div> 5</div>
            <div> 6</div>
            <div> 7</div>
            <div>8</div>
          
           

        </div>
    </body>
</html>
