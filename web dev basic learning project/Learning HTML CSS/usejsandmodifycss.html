<!DOCTYPE html>
<html>
    <head>
        <title> modify css by javascript</title>
        <style type="text/css">
            #main{
                color:red;
                font-size:50px;
                text-align: center;
                margin-top:50px;
                cursor:pointer;
                transition:2s;
            }
        </style>
    </head>
    <body>
        <div id ="main" onmouseenter="modify()" onmouseleave="unmodify()">
Tanya Goyal
        </div>

    </body>
    <script type="text/javascript">
        function modify(){
   document.getElementById("main").style.fontSize = "100px";
   document.getElementById("main").style.color="blue";

        }
        function unmodify(){
            document.getElementById("main").style.fontSize="50px";
            document.getElementById("main").style.color="red";
        }



    </script>
</html>
