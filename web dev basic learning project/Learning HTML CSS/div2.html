<!DOCTYPE html>
<html>
    <head>
        <title>TEXT CSS</title>
     <style type="text/css">
        .text{
            
            width:500px;
            height:200px;
            
            background-color: pink;
            font-size:50px;
            color:blue;
            font-weight:bold;
            font-style:italic;
            text-align: center;
            text-decoration:underline;                                               
            text-transform: uppercase;
            word-spacing: 10px;
            letter-spacing: 5px;
            }
        .para{
            width:1000px;
            height:400px;
            background-color:lightgrey;
            font-size:30px;
            color:red;
            font-weight:bold;
            font-style:italic;
            }
</style>
    </head>
    <body>
        <div class="text">
           Welcome to Web Development
      </div>
      <p class="para">

        Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque quasi asperiore
        s perspiciatis molestias aliquid? Quibusdam tempora asperiores,
         impedit itaque molestias recusandae? Nihil repellendus molestiae dolores 
         tempore, facere laboriosam ad accusamus.
      </p>
        
    </body>
</html>
