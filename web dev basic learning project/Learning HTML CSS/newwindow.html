<!DOCTYPE html>
<html>
    <head>
        <title> New window</title>
    </head>
    <script type ="text/javascript">
        var win;
        function openwin(){
            win= window.open("https:www.wscubetech.com");
        }
        function closewin(){
            win.close();
        }
    
    </script>
    <body>
        <button onclick="openwin()"> open Wscube Tech</button>
           <button onclick="closewin()"> close Wscube Tech</button>
    </body>
</html>
