<!DOCTYPE html>
<htm>
    <head>
        <title>
Form Level 2
        </title>
    </head>
    <body>
        <form>
            <fieldset>
            <legend>HTML5</legend>
            color:
            <input type="color" name="color 
            <input type="text" name="name"  placeholder="Enter your name" required="" autofocus="" /><br/><br/>
            Hobbies:
            <input type="checkbox" value="reading" />Reading
            <input type="checkbox" value="travelling" />Travelling<br/><br/>
            Gender:
            <input type="radio" value="m" name="gender"/>Male
            <input type="radio" value="F" name="gender  "/>Female
            <br/><br/>
            Number:
            <input type="number" name="number" /><br/><br/>
            Range:
            <input type="range" name="range" /><br/><br/>
            <input type="submit" value="Submit" />
        </fieldset>
        </form>
    </body>
</htm>
