<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
</head>
<body>
  <input type="number" name="first" id="first" step="any" />

  <select id="op">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="/">/</option>
    <option value="*">×</option>
  </select>

  <input type="number" name="second" id="second" step="any" />
  <br /><br />

  <button onclick="cal()">Calculate</button>

  <input type="text" id="res" readonly />

  <script type="text/javascript">
    function cal() {
      var opr1 = parseFloat(document.getElementById("first").value);
      var opr2 = parseFloat(document.getElementById("second").value);
      var op = document.getElementById("op").value;
      var res = 0;

      if (op == "+") {
        res = opr1 + opr2;
      } else if (op == "-") {
        res = opr1 - opr2;
      } else if (op == "*") {
        res = opr1 * opr2;
      } else if (op == "/") {
        if (opr2 == 0) {
          alert("Cannot divide by zero!");
          return;
        }
        res = opr1 / opr2;
      }

      document.getElementById("res").value = res;
      alert(res);
    }
  </script>
</body>
</html>
