<!DOCTYPE html>
<html>
    <head>
        <title>CSS3 Animation Example</title>
        <style type="text/css">
.box{
    width: 600px;
    height: 600px;
    border: 2px solid grey;
    margin: auto;
    position: relative;
}
.bolt{
    width:200px;
    height:200px;
    background-color:purple;
    position: absolute;
    top:0px;
    left:0px;
    animation-name: bolt;
    animation-duration: 4s;
    
    animation-iteration-count: infinite; 
    animation-fill-mode: forwards;
    animation-direction: alternate-reverse;
    animation-timing-function: ease-in-out;


}
@keyframes bolt{ 
    0%{
        top:0px;
        left:0px;
        background-color: purple;
    }
    25%{
        top:0px;
        left:400px;
        background-color: orange;
    }
    50%{
        top:400px;
        left:400px;
        background-color: yellow;
    }
    75%{
        top:400px;
        left:0px;
        background-color: green;
    }
    100%{
        top:0px;
        left:0px;
        background-color: pink;

}
}

           
            
        </style>
    </head>
    <body> 
        <div class="box">
            <div class="bolt">

            </div>

        </div>
    </body>
</html>
