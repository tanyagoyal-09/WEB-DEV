<!DOCTYPE html>
<html>
    <head>
    <title>Form </title>

    </head>
    <body>
     
        <form>
            <fieldset>
                <legend>EnquiryForm</legend>
            Name:<input type="text" />
            <br/><br/>
            Address:<textarea name="address">  </textarea>
            <br/><br/>
           Gender:
           <input type="radio" value="m"  name="gender"/>Male 
           <input type="radio" value="F"  name="gender"/>Female
            <input type="radio" value="m"  name="gender"/>other
           <br/><br/>
           country:
            <select>
                <option>India</option><optiongroup>
                <option>Africa</option>
                <option>Australia</option>

                </optiongroup>
                <option>USA</option>
                <option>UK</option>
                <option>Canada</option>
            </select><br/><br/>
            Hobbies: <br/>
            <input type="checkbox" value="reading"/>Reading<br/>

            <input type="checkbox" value="travelling"/>Travelling<br/>

            <input type="checkbox" value="swimming"/>Swimming<br/>
            <br/><br/>
          Image:
            <input type="file"/>
            <br/><br/>
            Phone:<input type="text"/>
            <br/><br/>
            <input type="submit" value="Submit"/>
            <input type="reset" value="Reset"/>
            </fieldset>
        </form>
    </body>
</html>
