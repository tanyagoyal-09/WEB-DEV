<!DOCTYPE html>
<html>
    <head>
        <title>Calender</title>
        <body>
        <form>
            <fieldset>
                <legend>Calender</legend>
                 Date:
                <input type="date" name="date"/><br/><br/>

                <input type="time" name="time"/><br/><br/>

        <input type="submit" value="Submit"/>
            </fieldset>
        </form>
        </body>
    </head>
</html>
