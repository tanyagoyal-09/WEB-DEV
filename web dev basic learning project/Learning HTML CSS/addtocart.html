<!DOCTYPE html>
<html>
    <head>
        <title>Navigation Page</title>
        <style>
            .box{
                width:300px;
                height:300px;
            border: 2px solid grey;
            margin:auto;
            margin-top: 100px; 
            }
            .box img{
                width:100%;
                height:100%;
                transition: transform 0.5s ease;
            }
            .box img:hover{
                transform: scale(1.2);
            }
            .add{
                width: 100%;
                font-size: 30px;
                background-color: rgba(0,0,0,0.6);
                color: white;
                position: absolute;
               left :0px;
               bottom: -40px;
               opacity:0;
            transition: all 0.5s ease;
            }
            .box:hover .add{
                bottom: 0px;
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <img src="https://plus.unsplash.com/premium_photo-1673002094195-f18084be89ce?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1170"/>
            <input type="button" value="Add to Cart" class="add"/>
        </div>
    
    </body>
