<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Bat Ball Stump Game</title>
</head>
<body>

    <h1 class="hello">Bat Ball Stump Game</h1>

    <button class="helo" onclick="playGame('Bat')">Bat</button>
    <button class="helo" onclick="playGame('Ball')">Ball</button>
    <button class="helo" onclick="playGame('Stump')">Stump</button>

    <script>
        function playGame(userChoice) {

            // Generate random computer choice
            let randomNumber = Math.random() * 3;
            let computerChoice;

            if (randomNumber <= 1) {
                computerChoice = 'Bat';
            } else if (randomNumber <= 2) {
                computerChoice = 'Ball';
            } else {
                computerChoice = 'Stump';
            }

            // Result logic
            let resultMessage;

            if (userChoice === computerChoice) {
                resultMessage = "It's a Tie 😐";
            } 
            else if (
                (userChoice === 'Bat' && computerChoice === 'Ball') ||
                (userChoice === 'Ball' && computerChoice === 'Stump') ||
                (userChoice === 'Stump' && computerChoice === 'Bat')
            ) {
                resultMessage = "You Win 🎉";
            } 
            else {
                resultMessage = "Computer Wins 💻";
            }

            // Final alert
            alert(
                `You chose: ${userChoice}\n` +
                `Computer chose: ${computerChoice}\n` +
                `${resultMessage}`
            );
        }
    </script>

</body>
</html>
